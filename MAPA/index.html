<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa świata Felorost – Wielka Encyklopedia Uniwersum Felorostu</title>
  <meta name="description" content="Interaktywna, publikowana w internecie mapa świata Felorost: kontynenty, księstwa, prowincje, miasta i biskupstwa.">
  <link rel="icon" type="image/png" href="../KRA/favicon.png">
  <link rel="apple-touch-icon" href="../KRA/favicon.png">
  <link rel="stylesheet" href="style.css?v=1">
</head>
<body>
  <div class="map-shell">
    <header class="map-topbar">
      <a class="map-brand" href="../index.html">
        <img src="../KRA/favicon.png" alt="Herb Gryfionów">
        <span>Wielka Encyklopedia Uniwersum Felorostu
          <small>Interaktywna mapa świata</small>
        </span>
      </a>
      <nav class="map-nav" aria-label="Nawigacja">
        <a href="../index.html">Strona główna</a>
        <a href="../miejsca.html">Miejsca</a>
        <a href="../historia.html">Oś czasu</a>
        <a href="../organizacje.html">Państwa</a>
        <a href="index.html" class="active">Mapa</a>
      </nav>
    </header>

    <main class="map-main">
      <div class="map-toolbar">
        <div class="map-search">
          <input id="search" list="placeList" type="search" autocomplete="off"
                 placeholder="Szukaj miejsca, krainy lub biskupstwa…" aria-label="Szukaj na mapie">
          <datalist id="placeList"></datalist>
        </div>

        <div class="map-layers" aria-label="Warstwy mapy">
          <label><input type="checkbox" id="layerPolitical" checked> Polityczna</label>
          <label><input type="checkbox" id="layerPhysical" checked> Fizyczna</label>
          <label><input type="checkbox" id="layerBishops"> Biskupstwa</label>
          <label><input type="checkbox" id="layerLabels" checked> Nazwy</label>
        </div>

        <div class="map-zoom">
          <button id="zoomOut" title="Pomniejsz" aria-label="Pomniejsz">−</button>
          <span id="zoomLevel">100%</span>
          <button id="zoomIn" title="Powiększ" aria-label="Powiększ">+</button>
          <button id="zoomReset" title="Cała mapa" aria-label="Cała mapa">⌂</button>
        </div>
      </div>

      <div class="map-stage" id="stage">
        <svg id="map" viewBox="0 0 2100 1500" role="img"
             aria-label="Interaktywna mapa świata Felorost"></svg>

        <div class="map-tooltip" id="tooltip" role="status" aria-live="polite"></div>

        <aside class="map-panel" id="panel" aria-label="Szczegóły miejsca"></aside>

        <div class="map-legend" aria-hidden="true">
          <span><b class="legend-star">★</b> stolica</span>
          <span><span class="legend-dot" style="background:#f4ead2;border:1.5px solid #3f2e18"></span> miasto</span>
          <span><span class="legend-dot" style="background:#7a5a3a"></span> twierdza / zamek</span>
          <span><span class="legend-dot" style="background:#6b4f8a"></span> klasztor</span>
          <span><b class="legend-cross">✚</b> biskupstwo</span>
        </div>

        <div class="map-note">
          Pierwszy szkic kanoniczny. Kształty i położenia krain są robocze — będą sukcesywnie poprawiane.
        </div>
      </div>
    </main>
  </div>

  <script src="data/swiat.js?v=1"></script>
  <script src="app.js?v=1"></script>
</body>
</html>
